services:
  app:
    build: .
    container_name: enterprise-data-agent-app
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # 容器内必须通过服务名访问数据库，不能继承宿主机 .env 中的 localhost 连接串。
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+psycopg://agent_reader:agent_reader_password@postgres:5432/agent_db}
      DEFAULT_DATA_SOURCE: ${COMPOSE_DEFAULT_DATA_SOURCE:-postgresql}
      SQL_MAX_LIMIT: ${SQL_MAX_LIMIT:-200}
      SQL_MAX_RETRIES: ${SQL_MAX_RETRIES:-2}
      SQL_STATEMENT_TIMEOUT_MS: ${SQL_STATEMENT_TIMEOUT_MS:-5000}
    ports:
      - "8000:8000"
    volumes:
      - ./charts:/app/charts
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./data/tasks:/app/data/tasks
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: enterprise-data-agent-postgres
    environment:
      POSTGRES_DB: agent_db
      POSTGRES_USER: agent_owner
      POSTGRES_PASSWORD: agent_owner_password
    ports:
      - "15432:5432"
    volumes:
      - agent_postgres_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./data/sample_api_logs.csv:/docker-entrypoint-initdb.d/sample_api_logs.csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_owner -d agent_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_postgres_data:
