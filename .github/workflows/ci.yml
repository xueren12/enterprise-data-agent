name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Start FastAPI and PostgreSQL
        run: docker compose up -d --build
      - name: Verify health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Run deterministic rule and SQL safety evaluation
        run: |
          python evaluation/run_evaluation.py --mode rule \
            --database-url "postgresql+psycopg://agent_reader:agent_reader_password@localhost:15432/agent_db" \
            --output evaluation/results/ci-postgresql.json
      - name: Verify PostgreSQL seed data and read-only role
        env:
          INTEGRATION_DATABASE_URL: postgresql+psycopg://agent_reader:agent_reader_password@localhost:15432/agent_db
        run: pytest tests/test_postgresql_integration.py -q
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up Docker Compose
        if: always()
        run: docker compose down -v
